spring.application.name=padhora-backend

# Railway will inject these as environment variables when you connect a Postgres plugin.
# Locally, set them yourself or run against a local Postgres instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padhora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Shared secret required in the X-Admin-Key header to view/approve/reject listings.
# Set this as a real value in Railway's Variables tab - don't leave it as the default below.
padhora.admin-key=${PADHORA_ADMIN_KEY:changeme}

# Secret key used to sign tutor login tokens (JWT). Must be a base64 string decoding to
# at least 32 bytes. Set PADHORA_JWT_SECRET as a real value in Railway - don't leave the default.
padhora.jwt-secret=${PADHORA_JWT_SECRET:BikwLbCfWl3ADkODnsSjnnqU8yjxv8bpGEWAC3ZRZj0=}

# STUB: no SMS provider connected yet. Defaults to FALSE (secure) - OTPs are only ever
# logged/echoed if you explicitly set PADHORA_OTP_STUB_MODE=true in Railway, which you'll
# need to do for now to keep testing "My Requests" until a real SMS provider is wired in.
# Unset it (or set to false) before real, non-test parents start using this.
padhora.otp.stub-mode=${PADHORA_OTP_STUB_MODE:false}
