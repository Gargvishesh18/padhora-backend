spring.application.name=padhora-backend

# Railway will inject these as environment variables when you connect a Postgres plugin.
# Locally, set them yourself or run against a local Postgres instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padhora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is owned by Flyway (src/main/resources/db/migration), not by Hibernate.
# `validate` means the app refuses to start if the entities and the database disagree,
# instead of silently altering tables underneath us the way ddl-auto=update did.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# The Railway database predates Flyway: it was built up by ddl-auto=update and already has
# real tutor and enquiry rows. baseline-on-migrate stamps that existing schema as version 1
# (V1__baseline.sql, which reproduces exactly what Hibernate had created) and applies V2
# onwards. V1 therefore never runs against production - it only builds a fresh database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema created by Hibernate ddl-auto
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

# Shared secret required in the X-Admin-Key header to view/approve/reject listings.
# Set this as a real value in Railway's Variables tab - don't leave it as the default below.
padhora.admin-key=${PADHORA_ADMIN_KEY:changeme}

# Secret key used to sign tutor login tokens (JWT). Must be a base64 string decoding to
# at least 32 bytes. Set PADHORA_JWT_SECRET as a real value in Railway - don't leave the default.
padhora.jwt-secret=${PADHORA_JWT_SECRET:BikwLbCfWl3ADkODnsSjnnqU8yjxv8bpGEWAC3ZRZj0=}

# STUB: no SMS provider connected yet. Defaults to FALSE (secure) - OTPs are only ever
# logged/echoed if you explicitly set PADHORA_OTP_STUB_MODE=true in Railway, which you'll
# need to do for now to keep testing "My Requests" until a real SMS provider is wired in.
# Unset it (or set to false) before real, non-test parents start using this.
padhora.otp.stub-mode=${PADHORA_OTP_STUB_MODE:false}

# Server-side Google key used only by the one-off locality geocoding pass
# (POST /api/admin/localities/geocode). Separate from the browser key in the frontend:
# this one should be IP/API restricted to the Geocoding API, not left unrestricted.
# Leave unset and the endpoint reports itself unconfigured instead of failing oddly.
padhora.google.geocoding-key=${PADHORA_GOOGLE_GEOCODING_KEY:}
